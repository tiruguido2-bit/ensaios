<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2F27">

  <title>Maths Photo | Ensaios fotográficos</title>

  <meta name="description" content="Ensaios fotográficos de cosplay, retratos e projetos criativos em São Paulo e Guarulhos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1E2F27;
      --bg-dark: #17251E;
      --card: #263A30;
      --text: #DCDCD2;
      --muted: #A7B0A6;
      --accent: #83A99D;
      --line: rgba(220, 220, 210, 0.16);
      --font-body: "DM Sans", sans-serif;
      --font-title: "Playfair Display", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(1120px, 88%);
      margin: auto;
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }

    .nav-links a:hover,
    .text-link:hover {
      color: var(--accent);
    }

    .hero {
      min-height: 530px;
      display: flex;
      align-items: center;
      padding: 100px 0 110px;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    h1, h2, h3 {
      font-weight: 400;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(46px, 8vw, 88px);
      line-height: 1.08;
      letter-spacing: -1.5px;
      max-width: 850px;
    }

    .hero p {
      color: var(--muted);
      max-width: 550px;
      margin-top: 26px;
      font-size: 15px;
    }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: var(--accent);
      color: var(--bg-dark);
      padding: 13px 22px;
      border: 1px solid var(--accent);
      font-size: 12px;
      font-weight: 700;
      transition: 0.2s;
      cursor: pointer;
    }

    .button:hover {
      background: var(--text);
      border-color: var(--text);
    }

    .text-link {
      font-size: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
    }

    section {
      padding: 88px 0;
      border-top: 1px solid var(--line);
    }

    .section-head {
      margin-bottom: 36px;
    }

    .section-head h2 {
      font-family: var(--font-title);
      font-size: clamp(34px, 5vw, 49px);
      line-height: 1.2;
    }

    .section-head p {
      color: var(--muted);
      margin-top: 12px;
      max-width: 600px;
      font-size: 14px;
    }

    /* PORTFÓLIO */

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .photo-slot {
      aspect-ratio: 3 / 4;
      background: var(--bg-dark);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .photo-slot::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      transition: border-color 0.25s;
      pointer-events: none;
    }

    .photo-slot:hover::after {
      border-color: var(--accent);
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 12px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .placeholder span {
      display: block;
      color: var(--accent);
      font-family: var(--font-title);
      font-size: 32px;
      margin-bottom: 8px;
    }

    .photo-wide {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 7;
    }

    /* PACOTES */

    .packages {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .package {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .package-number {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .package h3 {
      font-family: var(--font-title);
      font-size: 29px;
      line-height: 1.25;
    }

    .price {
      font-size: 29px;
      font-weight: 500;
      margin: 14px 0 16px;
    }

    .price small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .package p,
    .package li {
      color: var(--muted);
      font-size: 13px;
    }

    .package ul {
      list-style: none;
      margin: 0 0 24px;
      width: 100%;
    }

    .package li {
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .package li::before {
      content: "＋";
      color: var(--accent);
      margin-right: 9px;
    }

    .package .button {
      margin-top: auto;
    }

    .note {
      border-left: 2px solid var(--accent);
      padding: 14px 18px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(0, 0, 0, 0.08);
    }

    /* AGENDAMENTO */

    .booking-layout {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 55px;
      align-items: start;
    }

    .booking-copy p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 16px;
    }

    form {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 30px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      background: var(--bg-dark);
      color: var(--text);
      border-radius: 0;
      outline: none;
      font-size: 13px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    input::placeholder, textarea::placeholder {
      color: #89968C;
    }

    select option {
      background: var(--bg-dark);
    }

    textarea {
      resize: vertical;
      min-height: 105px;
    }

    .form-note {
      color: var(--muted);
      font-size: 11px;
      margin: 0 0 18px;
    }

    form .button {
      width: 100%;
    }

    /* CONTATO */

    .contact-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      background: var(--bg-dark);
      padding: 36px;
      border: 1px solid var(--line);
    }

    .contact-panel h3 {
      font-family: var(--font-title);
      font-size: 29px;
    }

    .contact-panel p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    .contact-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 25px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    @media (max-width: 760px) {
      .nav {
        padding: 20px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        gap: 18px;
      }

      .hero {
        min-height: auto;
        padding: 85px 0 90px;
      }

      section {
        padding: 65px 0;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .photo-wide {
        aspect-ratio: 4 / 3;
      }

      .packages,
      .booking-layout {
        grid-template-columns: 1fr;
      }

      .booking-layout {
        gap: 28px;
      }

      .package {
        padding: 23px;
      }

      form {
        padding: 22px;
      }

      .contact-panel {
        align-items: flex-start;
        flex-direction: column;
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container nav">
      <a class="logo" href="#inicio">MATHS PHOTO</a>
